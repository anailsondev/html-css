<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão 01</title>
    <style>
       :root {
    --cor-fundo: #F3F6FB;
    --cor-faixa: #24476B;
    --cor-titulo: #24476B;
    --cor-texto: #263445;
    --cor-destaque: #D98E04;
    --cor-secundaria: #52677D;
}

       

        *{
            padding: 0;
            margin: 0;
        }

        body {
            background-color: var(--cor-fundo);
        }


        h1 {
            background-color: var(--cor-faixa);
            color: var(--cor-fundo);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 2.7em;
            padding: 20px;
            text-align: center;

        }

        h2 {
            color: var(--cor-secundaria);
            text-align: center;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: bolder;
            margin-top: 20px;
        }

        strong {
            color: var(--cor-destaque) ;
        } 

        p{
            color: var(--cor-texto);
            text-align: center;
            margin-top: 20px;
            font-family: Arial, Helvetica, sans-serif;

        }

        hr {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <h2>Meu espaço de estudos</h2>
    <p>Estou aprendendo <strong>HTML5</strong> e CSS3 para criar minhas primeiras páginas.</p>
    <hr>
    <p>O <strong>HTML</strong> organiza o conteúdo; o <em>CSS</em> cuida da aparência.</p>
    <p>Meu objetivo é praticar um pouco todos os dias</p>
</body>
</html>
