<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            text-align: center;
            padding: 10px;
            text-align: justify;
        }

        .tabela {
            background-color: gray;
        }

        .cor1 {
             background-color: gray;

        }

        .cor2 {
             background-color: gray;
        }
    </style>
</head>
<body>
    <table>
        <thead class="tabela">
            <tr>
                <th rowspan="3">Àrea</th>
                <th rowspan="3">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <td>Nota 1</td>
                <td colspan="">Nota 2</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>9</td>
                <td>7.5</td>
                <td>8.5</td>
            </tr>
            <tr>
                <td>Fisica</td>
                <td>6</td>
                <td>8</td>
                <td>9.5</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td>7</td>
                <td>9</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>10</td>
                <td>8</td>
                <td>6.5</td>
            </tr>
            <tr class="cor1">
                <th colspan="4">Média de Exatas</th>
                <td>9</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>8</td>
                <td>7.5</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>10</td>
                <td>8</td>
                <td>7</td>
            </tr>
            <tr>
                <th colspan="4" class="cor2">Média de Humanas</th>
                <td class="cor2">9</td>
            </tr>

        </tbody>
    </table>
</body>
</html>
