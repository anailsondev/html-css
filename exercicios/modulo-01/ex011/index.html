<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmentee aumente e diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1000px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexivel">
    </picture>
    <h1>Reproduzindo Àudio</h1>
    <p>Vamos aprender a reproduzir Àudios em HTML5.</p>
 <!-- <audio src="midias/guanacast-33 (1).mp3" controls autoplay></audio> MP3 OGG WAV -->
    <audio preload="metadata" autoplay controls loop >
        <source src="midias/guanacast-33 (1).mp3" type="audio/mpeg">
        <source src="midias/guanacast-33 (1).ogg" type="audio/ogg">
        <source src="midias/guanacast-33 (1).wav" type="audio/wav">
        <p>Seu navegador não suporta áudio <a href="midias/guanacast-33 (1).mp3">Clique aqui para baixar seu arquivo</a></p>
    </audio>
</body>
</html>
